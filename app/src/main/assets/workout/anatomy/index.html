<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' data: blob:; img-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'none'"><title>训练肌群 · 3D 解剖</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f4f5f7;font-family:system-ui,sans-serif;color:#18212a}canvas{display:block;touch-action:none}#status{position:absolute;top:18px;left:18px;right:18px;padding:12px 16px;border-radius:16px;background:#fffD;font-size:14px;pointer-events:none}.tools{position:absolute;bottom:24px;left:12px;right:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:24px;padding:12px 17px;background:white;color:#087ddd;font-size:14px;box-shadow:0 2px 10px #0001}button.active{color:white;background:#0088ff}#label{position:absolute;bottom:85px;left:16px;right:16px;text-align:center;font-size:14px;padding:8px;background:#fffB;border-radius:12px;pointer-events:none}</style></head>
<body><div id="status">正在加载本机 3D 模型…</div><div id="label">单指旋转 · 双指缩放 · 点选肌肉</div><div class="tools"><button id="whole">全身</button><button id="focus">仅看选中肌群</button><button id="bones">骨骼</button><button id="reset">复位</button></div>
<script src="dist/three.js"></script><script src="loaders.js"></script>
<script>
'use strict';
const statusEl=document.getElementById('status'), labelEl=document.getElementById('label');
const params=new URLSearchParams(location.search);let selected=normaliseMuscle(params.get('muscle')||''),focused=false,bones=false,root=null,meta=new Map(),pickable=[];
const muscleTerms={'胸':['胸大肌','胸小肌'],'背':['背阔肌','菱形肌','竖脊肌','大圆肌','小圆肌'],'腿':['股四头','股直肌','股内侧肌','股外侧肌','股二头肌','半腱肌','半膜肌','缝匠肌','内收肌'],'肩':['三角肌','冈上肌','冈下肌','肩胛下肌'],'二头':['肱二头肌'],'三头':['肱三头肌'],'腹':['腹直肌','腹外斜肌','腹内斜肌','腹横肌'],'臀':['臀大肌','臀中肌','臀小肌'],'小腿':['腓肠肌','比目鱼肌','胫骨前肌'],'前臂':['桡侧','尺侧','指伸肌','指浅屈肌','旋前','旋后'],'前锯肌':['前锯肌'],'斜方肌':['斜方肌'],'颈部':['胸锁乳突肌','颈','斜角肌']};
THREE.Loader.Handlers.get=url=>THREE.DefaultLoadingManager.getHandler(url);
const scene=new THREE.Scene();scene.background=new THREE.Color('#f4f5f7');
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,10000);
let renderPending=false;function render(){if(!renderer||!root||renderPending)return;renderPending=true;requestAnimationFrame(()=>{renderPending=false;renderer.render(scene,camera);});}
let renderer,controls;const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
function showError(error){statusEl.style.display='block';statusEl.textContent='模型加载失败：'+(error.message||error);document.body.dataset.loadState='error';}
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);controls=new THREE.OrbitControls(camera,renderer.domElement);controls.autoRotate=false;controls.enableDamping=false;controls.addEventListener('change',render);controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI;scene.add(new THREE.HemisphereLight(0xffffff,0xb8bec7,1.1));const a=new THREE.DirectionalLight(0xffffff,.9);a.position.set(2,4,5);scene.add(a);const b=new THREE.DirectionalLight(0xffffff,.5);b.position.set(-2,1,-3);scene.add(b);}catch(error){showError(error);}
function labelFor(mesh){let current=mesh;while(current){const found=meta.get(current.name);if(found)return found;current=current.parent;}return null;}
function isMuscle(info){return !!info&&info.groups.some(x=>x.includes('肌肉'));}
function isBone(info){return !!info&&info.groups.some(x=>x.includes('骨骼'));}
function normaliseMuscle(name){const aliases={'腹部':'腹','臀部':'臀','核心稳定':'腹','全身':'','功能性':'','热身动作':'','拉伸':'','有氧':'','组合':'','计时动作':'','Tabata':'','自重':''};return Object.prototype.hasOwnProperty.call(aliases,name)?aliases[name]:name;}
function matches(info){if(!selected||!info)return false;const terms=muscleTerms[selected]||[selected];return terms.some(term=>(info.zh+' '+info.groups.join(' ')).includes(term));}
function recolor(){if(!root)return;let selectedCount=0;pickable=[];root.traverse(mesh=>{if(!mesh.isMesh)return;const info=labelFor(mesh),muscle=isMuscle(info),bone=isBone(info),hit=muscle&&matches(info);mesh.visible=(focused?hit:muscle)||(bones&&bone);if(!mesh.visible)return;if(muscle)pickable.push(mesh);if(hit)selectedCount++;for(const mat of (Array.isArray(mesh.material)?mesh.material:[mesh.material])){mat.emissive&&mat.emissive.set(hit?0xcc2222:0x000000);if(mat.emissiveIntensity!==undefined)mat.emissiveIntensity=hit ? .6 : 0;const transparent=!focused&&!!selected&&!hit;if(mat.transparent!==transparent){mat.transparent=transparent;mat.needsUpdate=true;}mat.opacity=transparent ? .24 : 1;mat.depthWrite=!transparent;}});document.getElementById('focus').classList.toggle('active',focused);document.getElementById('bones').classList.toggle('active',bones);labelEl.textContent=selected?selected+' · '+selectedCount+' 个解剖结构':'单指旋转 · 双指缩放 · 点选肌肉';document.body.dataset.selectedCount=String(selectedCount);render();}
let home={position:null,target:null};function fit(onlyVisible=false){if(!root||!controls)return;const box=new THREE.Box3();if(onlyVisible){root.traverse(mesh=>{if(mesh.isMesh&&mesh.visible)box.expandByObject(mesh);});}else box.setFromObject(root);if(box.isEmpty())return;const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());const distance=Math.max(size.y,size.x/camera.aspect)/(2*Math.tan(camera.fov*Math.PI/360))*1.2;camera.position.set(center.x,center.y,center.z+distance);camera.near=distance/1000;camera.far=distance*30;camera.updateProjectionMatrix();controls.target.copy(center);controls.minDistance=distance*.08;controls.maxDistance=distance*3;controls.update();home={position:camera.position.clone(),target:center.clone()};}
function setMuscle(name){selected=normaliseMuscle(name||'');focused=false;recolor();}window.setTrainingMuscle=setMuscle;
document.getElementById('whole').onclick=()=>{selected='';focused=false;recolor();fit();};document.getElementById('focus').onclick=()=>{if(!selected){labelEl.textContent='先点选肌肉，或从动作详情选择肌群';return;}focused=!focused;recolor();fit(focused);};document.getElementById('bones').onclick=()=>{bones=!bones;recolor();};document.getElementById('reset').onclick=()=>{if(root)fit(focused);};
let down=null;if(renderer){renderer.domElement.addEventListener('pointerdown',event=>{down=[event.clientX,event.clientY];});renderer.domElement.addEventListener('pointerup',event=>{if(!down||Math.hypot(event.clientX-down[0],event.clientY-down[1])>7)return;pointer.set(event.clientX/innerWidth*2-1,-event.clientY/innerHeight*2+1);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(pickable,false)[0];if(hit){const info=labelFor(hit.object);if(info){const group=Object.keys(muscleTerms).find(name=>muscleTerms[name].some(term=>info.zh.includes(term)));selected=group||info.zh;labelEl.textContent=info.zh;recolor();labelEl.textContent=info.zh+' · '+selected;}}});}
addEventListener('resize',()=>{if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render();});
async function load(){const labels=await fetch('mesh-map.json').then(r=>{if(!r.ok)throw Error('肌群标签不可用');return r.json();});meta=new Map(labels.map(item=>[item.name,item]));THREE.DRACOLoader.setDecoderPath('gltf/');THREE.DRACOLoader.setDecoderConfig({type:'wasm'});const draco=new THREE.DRACOLoader();const loader=new THREE.GLTFLoader().setDRACOLoader(draco);loader.load('xitong/obj/all.emg',gltf=>{root=gltf.scene;root.traverse(mesh=>{if(mesh.isMesh){mesh.material=Array.isArray(mesh.material)?mesh.material.map(m=>m.clone()):mesh.material.clone();}});scene.add(root);fit();recolor();statusEl.style.display='none';document.body.dataset.loadState='ready';let meshCount=0;root.traverse(item=>{if(item.isMesh)meshCount++;});document.body.dataset.meshCount=String(meshCount);THREE.DRACOLoader.releaseDecoderModule();},progress=>{if(progress.total)statusEl.textContent='加载本机模型 '+Math.round(progress.loaded/progress.total*100)+'%';},showError);}
if(renderer){load().catch(showError);}
</script></body></html>
